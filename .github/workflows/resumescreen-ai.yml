name: Deploy ResumeScreen AI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resumescreen-ai-production
  cancel-in-progress: false

env:
  EC2_HOST: 54.254.237.169
  EC2_USER: ubuntu
  EC2_PORT: "22"
  APP_DIR: /opt/resumescreen-ai/current
  IMAGE_NAME: resumescreen-ai

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          set -e
          docker build \
            --pull \
            --platform linux/amd64 \
            -t "${IMAGE_NAME}:latest" .

      - name: Prepare SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e

          test -n "${EC2_SSH_KEY}" || {
            echo "EC2_SSH_KEY secret is missing"
            exit 1
          }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${EC2_SSH_KEY}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem

          ssh-keyscan \
            -p "${EC2_PORT}" \
            -H "${EC2_HOST}" \
            >> ~/.ssh/known_hosts

      - name: Test EC2 SSH
        run: |
          ssh \
            -i ~/.ssh/ec2.pem \
            -p "${EC2_PORT}" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "${EC2_USER}@${EC2_HOST}" \
            'echo "SSH OK"; docker --version; docker compose version'

      - name: Send image to EC2
        run: |
          set -e

          docker save "${IMAGE_NAME}:latest" \
            | gzip -1 \
            > "/tmp/${IMAGE_NAME}.tar.gz"

          scp \
            -i ~/.ssh/ec2.pem \
            -P "${EC2_PORT}" \
            "/tmp/${IMAGE_NAME}.tar.gz" \
            docker-compose.yml \
            "${EC2_USER}@${EC2_HOST}:/tmp/"

      - name: Deploy on EC2
        run: |
          ssh \
            -i ~/.ssh/ec2.pem \
            -p "${EC2_PORT}" \
            "${EC2_USER}@${EC2_HOST}" \
            'bash -se' <<'REMOTE'

          set -euo pipefail

          APP_DIR="/opt/resumescreen-ai/current"
