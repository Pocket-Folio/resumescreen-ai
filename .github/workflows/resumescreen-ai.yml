name: Deploy ResumeScreen AI to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resumescreen-ai-ec2
  cancel-in-progress: false

env:
  EC2_HOST: 54.254.237.169
  EC2_USER: ubuntu
  EC2_PORT: "22"
  APP_DIR: /opt/resumescreen-ai/current
  IMAGE_NAME: resumescreen-ai

jobs:
  deploy:
    name: Build and Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deployment files
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f docker-compose.yml
          test -f package.json
          test -f package-lock.json
          echo "Required deployment files are present."

      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --pull \
            --platform linux/amd64 \
            --tag "${IMAGE_NAME}:latest" \
            .
          docker image inspect "${IMAGE_NAME}:latest" >/dev/null
          echo "Docker image built successfully."

      - name: Package Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker save "${IMAGE_NAME}:latest" \
            | gzip -1 \
            > "/tmp/${IMAGE_NAME}.tar.gz"
          ls -lh "/tmp/${IMAGE_NAME}.tar.gz"

      - name: Prepare SSH key
        shell: bash
        env:
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          set -euo pipefail

          if [ -z "${EC2_SSH_KEY_B64}" ]; then
            echo "ERROR: GitHub secret EC2_SSH_KEY_B64 is missing."
            exit 1
          fi

          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"

          printf '%s' "${EC2_SSH_KEY_B64}" \
            | base64 --decode \
            > "${HOME}/.ssh/ec2.pem"

          chmod 600 "${HOME}/.ssh/ec2.pem"

          echo "Validating decoded PEM key..."
          ssh-keygen -y -f "${HOME}/.ssh/ec2.pem" >/dev/null
          echo "PEM key is valid."

          ssh-keyscan \
            -p "${EC2_PORT}" \
            -H "${EC2_HOST}" \
            >> "${HOME}/.ssh/known_hosts"

          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Test EC2 SSH connection
