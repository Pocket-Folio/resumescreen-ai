# ResumeScreen AI — single-container deployment.
#   docker compose up -d --build
# For HTTPS with automatic certificates, also include docker-compose.https.yml (see README).
name: resumescreen-ai

services:
  app:
    build: .
    image: resumescreen-ai:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8080
      DATA_DIR: /app/data
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-80}:8080"
    volumes:
      - resumescreen-data:/app/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  resumescreen-data:
    name: resumescreen-data
